<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visiting Faculty Salary Calculator</title>
<link rel="stylesheet" href="salary.css">
</head>

<body>
<!-- 🚨 SINGLE FORM - SABKUCH ANDAR -->
<form action="salary.php" method="POST" id="salaryForm">

<div class="container">
  <h1 class="form-title">Visiting Faculty Remuneration Bill</h1>

  <!-- BILL DATE -->
  <div class="section grid">
    <div>
      <label class="required">Bill Date :</label>
      <input type="date" name="bill_date" required>
    </div>
  </div>

  <!-- FACULTY DETAILS -->
  <div class="section">
    <h3>Faculty Details</h3>
    <div class="grid">
      <!-- Salutation + Full Name -->
      <div>
        <label class="required">Faculty Full Name :</label>
        <div class="name-flex">
          <select name="salutation" required>
            <option value="">Select</option>
            <option>Mr.</option><option>Ms.</option><option>Mrs.</option><option>Dr.</option>
          </select>
          <input type="text" name="faculty_name" placeholder="Enter full name" required>
        </div>
      </div>

      <!-- Gender -->
      <div>
        <label class="required">Gender :</label>
        <select name="gender" required>
          <option value="">Select</option>
          <option>Male</option><option>Female</option><option>Other</option>
        </select>
      </div>

      <!-- Contact -->
      <div>
        <label class="required">Contact :</label>
        <input type="tel" name="contact" placeholder="9876543210" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required>
      </div>

      <!-- Email -->
      <div>
        <label class="required">Email :</label>
        <input type="email" name="email" placeholder="example@gmail.com" required>
      </div>
    </div>
  </div>

  <!-- BILL DETAILS -->
  <div class="section">
    <h3>Bill Details</h3>
    <div class="grid">
      <div>
        <label class="required">Class :</label>
        <input type="text" name="class" required>
      </div>
      <div>
        <label class="required">Semester :</label>
        <input type="text" name="semester" inputmode="numeric" required maxlength="1" pattern="[1-6]{1}">
      </div>
      <div>
        <label class="required">Subject :</label>
        <input type="text" name="subject" required>
      </div>
      <div>
        <label class="required">Month :</label>
        <select name="month" required>
          <option value="">Select Month</option>
          <option>January</option><option>February</option><option>March</option>
          <option>April</option><option>May</option><option>June</option>
          <option>July</option><option>August</option><option>September</option>
          <option>October</option><option>November</option><option>December</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Coordinator Details -->
  <div class="section">
    <h3>Coordinator Details</h3>
    <div class="grid">
      <div>
        <label class="required">Coordinator Name :</label>
        <input type="text" name="coordinator_name" placeholder="Enter full name" required>
      </div>
      <div>
        <label class="required">Coordinator email</label>
        <input type="email" name="coordinator_email" placeholder="example@ves.ac.in" required>
      </div>
    </div>
  </div>

  <!-- THEORY LECTURES -->
  <div class="section">
    <h3>Theory Lectures</h3>
    <table id="theoryTable">
      <tr><th>Sr</th><th>Date</th><th>Day</th><th>From</th><th>To</th><th>No. of Hours</th></tr>
      <tr><td>1</td><td><input type="date"></td><td><select><option>Mon</option><option>Tue</option><option>Wed</option><option>Thu</option><option>Fri</option><option>Sat</option></select></td><td><input type="time"></td><td><input type="time"></td><td><input class="theoryH" value="0" oninput="calc()"></td></tr>
      <!-- ... baaki rows same ... -->
    </table>
    <button type="button" class="add" onclick="addRow('theoryTable','theory')">+ Add Theory</button>
  </div>

  <!-- PRACTICAL LECTURES (same structure) -->
  <div class="section">
    <h3>Practical Lectures</h3>
    <table id="practicalTable">
      <!-- Same table structure -->
    </table>
    <button type="button" class="add" onclick="addRow('practicalTable','practical')">+ Add Practical</button>
  </div>

  <!-- BILL SUMMARY -->
  <div class="section grid">
    <div><label>Theory Hours :</label><input id="theoryTotal" readonly></div>
    <div><label>Theory Rate :</label><input id="theoryRate" name="theory_rate" oninput="calcBill()"></div>
    <div><label>Practical Hours :</label><input id="practicalTotal" readonly></div>
    <div><label>Practical Rate :</label><input id="practicalRate" name="practical_rate" oninput="calcBill()"></div>
  </div>

  <div class="total-box">
    Total Bill Amount ₹ <span id="totalBill">0</span>
  </div>

  <!-- DIGITAL SIGNATURE -->
  <div class="section">
    <h3>Digital Signature</h3>
    <canvas id="sign"></canvas>
    <button type="button" class="add" onclick="clearSignature()">Clear Signature</button>
  </div>

  <!-- 🚨 SINGLE SUBMIT BUTTON -->
  <button type="submit" class="add" style="background:#1e4d8f; font-size:18px;">💰 SUBMIT BILL TO EXCEL</button>
</div>

</form>  <!-- FORM END -->

<script src="salary.js"></script>
</body>
</html>
